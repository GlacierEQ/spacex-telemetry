// Repository-local telemetry interchange schema for deterministic portfolio tests.
// This is not a SpaceX, Falcon, Starship, CCSDS, or production telemetry schema.
syntax = "proto3";
package glaciereq.telemetry.v1;

// Generic telemetry frame used for local serialization and handoff experiments.
message TelemetryFrame {
  string stream = 1;
  int64 seq = 2;
  int64 t_ms = 3;
  bytes payload = 4;
  map<string, double> metrics = 5;
}

// Generic local batch envelope; external persistence or transport is not implied.
message TelemetryBatch {
  repeated TelemetryFrame frames = 1;
  string source = 2;
  int64 produced_at_ms = 3;
}
