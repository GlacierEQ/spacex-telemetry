// Real telemetry wire format — dense binary for high-rate streams.
// Source of truth; regenerate Python with scripts/gen_proto.sh
syntax = "proto3";
package glaciereq.telemetry.v1;

// Single frame on the bus (matches Frame dataclass semantics).
message TelemetryFrame {
  string stream = 1;
  int64 seq = 2;
  int64 t_ms = 3;
  // Optional payload (sensor blob / JSON bytes when needed)
  bytes payload = 4;
  map<string, double> metrics = 5;
}

// Batch for inter-process / disk / helix handoff condensation.
message TelemetryBatch {
  repeated TelemetryFrame frames = 1;
  string source = 2;
  int64 produced_at_ms = 3;
}
